<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
}

/* COMMON SCREEN */

.screen{
    width:100vw;
    height:100vh;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background-size:cover;
    background-position:center;
    position:relative;
}

.active{
    display:flex;
}

/* LOGIN */

.login-box{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:30px;
    border-radius:20px;
    width:300px;
    text-align:center;
}

.login-box h2{
    color:white;
    margin-bottom:20px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
}

.login-box button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#ff4081;
    color:white;
    font-size:16px;
    cursor:pointer;
}

/* POPUP */

.popup{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    color:black;
    padding:15px 25px;
    border-radius:10px;
    z-index:9999;
    display:none;
    font-weight:bold;
}

/* SLIDE */

.slide-img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.heart-btn{
    position:absolute;
    top:50%;
    right:25px;
    transform:translateY(-50%);
    display:none;
    background:rgba(255,255,255,0.9);
    padding:12px;
    border-radius:20px;
    cursor:pointer;
    font-size:18px;
    animation:bounce 1s infinite;
}

@keyframes bounce{
    50%{
        transform:translateY(-50%) scale(1.1);
    }
}

/* QUESTION */

.question-box{
    text-align:center;
    color:white;
}

.question-box h1{
    margin-bottom:30px;
    font-size:42px;
}

.question-box button{
    padding:15px 30px;
    margin:10px;
    font-size:18px;
    border:none;
    border-radius:15px;
    cursor:pointer;
}

.yes{
    background:#4caf50;
    color:white;
}

.no{
    background:#f44336;
    color:white;
}

.end-text{
    color:white;
    font-size:32px;
}

</style>
</head>

<body>

<div class="popup" id="popup"></div>

<!-- LOGIN -->

<div id="loginScreen" class="screen active"
style="background-image:url('images/image1.jpg')">

<div class="login-box">

<h2>Welcome ❤️</h2>

<input
type="text"
id="username"
placeholder="Enter your cute name">

<input
type="password"
id="password"
placeholder="one who loves you more then anyone">

<button onclick="login()">
Open
</button>

</div>

</div>

<!-- SLIDES -->

<div id="slideScreen" class="screen">

<img id="slideImage"
class="slide-img"
src="">

<div class="heart-btn"
id="heartButton"
onclick="nextSlide()">

❤️ Click Here

</div>

</div>

<!-- QUESTION -->

<div id="questionScreen"
class="screen"
style="background-image:url('images/image7.jpg')">

<div class="question-box">

<h1>
Will you be my wife?🥺💕
</h1>

<button
class="yes"
onclick="yesClicked()">

YES

</button>

<button
class="no"
onclick="noClicked()">

NO

</button>

</div>

</div>

<!-- FINAL -->

<div id="finalScreen"
class="screen">

<img
src="images/image8.jpg"
class="slide-img">

</div>

<script>

/* GOOGLE SHEET URL */

const SCRIPT_URL =
"PASTE_YOUR_APPS_SCRIPT_URL_HERE";

/* SLIDES */

const slides = [
"images/image2.jpg",
"images/image3.jpg",
"images/image4.jpg",
"images/image5.jpg",
"images/image6.jpg"
];

let currentSlide = 0;

/* POPUP */

function showPopup(msg){

const popup =
document.getElementById("popup");

popup.innerHTML = msg;

popup.style.display = "block";

setTimeout(()=>{
popup.style.display = "none";
},1000);

}

/* LOGIN */

function login(){

const username =
document.getElementById("username")
.value
.trim()
.toLowerCase();

const password =
document.getElementById("password")
.value
.trim()
.toLowerCase();

const validUser =
username==="gunda" ||
username==="malini";

const validPass =
password==="bubbu";

if(!validUser || !validPass){

showPopup(
"Username starts with M/G and Password with B"
);

return;

}

/* SAVE TO GOOGLE SHEET */

fetch(SCRIPT_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:username,
password:password,
timestamp:new Date().toLocaleString()
})
}).catch(err=>console.log(err));

document
.getElementById("loginScreen")
.classList.remove("active");

document
.getElementById("slideScreen")
.classList.add("active");

loadSlide();

}

/* LOAD SLIDE */

function loadSlide(){

document.getElementById(
"slideImage"
).src = slides[currentSlide];

document.getElementById(
"heartButton"
).style.display = "none";

setTimeout(()=>{

document.getElementById(
"heartButton"
).style.display = "block";

},2000);

}

/* NEXT */

function nextSlide(){

currentSlide++;

if(currentSlide < slides.length){

loadSlide();

}
else{

document
.getElementById("slideScreen")
.classList.remove("active");

document
.getElementById("questionScreen")
.classList.add("active");

}

}

/* NO */

function noClicked(){

showPopup(
"INVALID OPTION ❌"
);

}

/* YES */

function yesClicked(){

showPopup(
"I LOVE YOU😘😍❤️"
);

setTimeout(()=>{

document
.getElementById("questionScreen")
.classList.remove("active");

document
.getElementById("finalScreen")
.classList.add("active");

setTimeout(()=>{

try{
window.close();
}catch(e){}

document.body.innerHTML =
"<div style='display:flex;justify-content:center;align-items:center;height:100vh;background:black;color:white;font-size:40px;'>❤️ THE END ❤️</div>";

},5000);

},1000);

}

</script>

</body>
</html>
