<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

.screen{
    width:100vw;
    height:100vh;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.active{
    display:flex;
}

.login-box{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:30px;
    border-radius:20px;
    width:320px;
    text-align:center;
}

.login-box h2{
    color:white;
    margin-bottom:20px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
}

.login-box button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#ff4081;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.popup{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    color:black;
    padding:15px 25px;
    border-radius:10px;
    z-index:9999;
    display:none;
    font-weight:bold;
}

.slide-img{
    width:100vw;
    height:100vh;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    object-position:center;
    background:black;
}

.heart-btn{
    position:absolute;
    top:50%;
    right:20px;
    transform:translateY(-50%);
    display:none;
    background:white;
    padding:12px 15px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
    animation:bounce 1s infinite;
}

@keyframes bounce{
    50%{
        transform:translateY(-50%) scale(1.1);
    }
}

.question-box{
    text-align:center;
    color:white;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(5px);
    padding:30px;
    border-radius:20px;
}

.question-box h1{
    font-size:clamp(28px,5vw,42px);
    margin-bottom:25px;
}

.question-box button{
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
}

.yes{
    background:#4CAF50;
    color:white;
}

.no{
    background:#F44336;
    color:white;
}

</style>
</head>

<body>

<div id="popup" class="popup"></div>

<!-- LOGIN PAGE -->

<div id="loginScreen"
class="screen active"
style="background-image:url('images/image1.jpeg')">

<div class="login-box">

<h2>Welcome ❤️</h2>

<input
type="text"
id="username"
placeholder="Enter your cute name">

<input
type="password"
id="password"
placeholder="The one who loves you more then anyone">

<button onclick="login()">
Open
</button>

</div>

</div>

<!-- SLIDESHOW -->

<div id="slideScreen" class="screen">



<div
id="heartButton"
class="heart-btn"
onclick="nextSlide()">

❤️ Click Here

</div>

</div>

<!-- QUESTION PAGE -->

<div id="questionScreen"
class="screen"
style="background-image:url('images/image7.jpeg')">

<div class="question-box">

<h1>
Will you be my wife?🥺💕
</h1>

<button
class="yes"
onclick="yesClicked()">
YES
</button>

<button
class="no"
onclick="noClicked()">
NO
</button>

</div>

</div>

<!-- FINAL PAGE -->

<div id="finalScreen" class="screen">

images/image8.jpeg

</div>

<script>

/* GOOGLE SHEET URL */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycby85GsF15Kp5FuZIX5JZTlngsDcKhkOPBrnaGUXMnHtfjUCBo8e_-FCOUNNksnFO1RqTA/exec";

/* SLIDES */

const slides = [
"images/image2.jpeg",
"images/image3.jpeg",
"images/image4.jpeg",
"images/image5.jpeg",
"images/image6.jpeg"
];

let currentSlide = 0;

/* POPUPS */

function showPopup(message){

const popup =
document.getElementById("popup");

popup.innerHTML = message;

popup.style.display = "block";

setTimeout(() => {

popup.style.display = "none";

},1000);

}

/* LOGIN */

function login(){

const username =
document.getElementById("username")
.value
.trim()
.toLowerCase();

const password =
document.getElementById("password")
.value
.trim()
.toLowerCase();

const validUser =
username === "gunda" ||
username === "malini";

const validPass =
password === "bubbu";

if(!validUser || !validPass){

showPopup(
"username starts with M/G and password with B"
);

return;

}

/* SAVE LOGIN */

fetch(SCRIPT_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:username,
password:password,
timestamp:new Date().toLocaleString()

})

}).catch(error => console.log(error));

document
.getElementById("loginScreen")
.classList.remove("active");

document
.getElementById("slideScreen")
.classList.add("active");

currentSlide = 0;

loadSlide();

}

/* LOAD IMAGE */

function loadSlide(){

document
.getElementById("slideImage")
.src = slides[currentSlide];

document
.getElementById("heartButton")
.style.display = "none";

setTimeout(() => {

document
.getElementById("heartButton")
.style.display = "block";

},2000);

}

/* NEXT */

function nextSlide(){

currentSlide++;

if(currentSlide < slides.length){

loadSlide();

}
else{

document
.getElementById("slideScreen")
.classList.remove("active");

document
.getElementById("questionScreen")
.classList.add("active");

}

}

/* NO */

function noClicked(){

showPopup(
"INVALID OPTION ❌"
);

}

/* YES */

function yesClicked(){

showPopup(
"I LOVE YOU😘😍❤️"
);

setTimeout(() => {

document
.getElementById("questionScreen")
.classList.remove("active");

document
.getElementById("finalScreen")
.classList.add("active");

setTimeout(() => {

window.location.href = "about:blank";

},5000);

},1000);

}

</script>

</body>
</html>
